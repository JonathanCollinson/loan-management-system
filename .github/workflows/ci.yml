name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/lms_ci
      JWT_SECRET: ci-test-secret
      SEED_SUPER_ADMIN_EMAIL: ci@example.com
      SEED_SUPER_ADMIN_PASSWORD: CiPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lms/api run test
      - run: pnpm --filter @lms/api run test:integration
        env:
          INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/lms_integration
      - run: pnpm --filter @lms/web run test
      - run: pnpm --filter @lms/api run build
      - run: pnpm --filter @lms/web run build
      - run: pnpm --filter @lms/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lms/web run test:e2e
        env:
          CI: true
