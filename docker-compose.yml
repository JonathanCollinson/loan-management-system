services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Host 4001 avoids clashing with local `pnpm run dev:api` (Nest on 4000).
    ports:
      - "4001:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27018/lms
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-admin@example.com}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      - mongo

volumes:
  mongo_data:
